<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}SGOD PMES{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css"
    />
    <!-- Base styles (header, navbar, layout) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <!-- Page-specific styles (inserted by child templates) -->
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <!-- ===== HEADER: Logos ===== -->
    <header>
      <div id="logo-bar">
        <img
          src="{{ url_for('static', filename='images/deped.png') }}"
          alt="DepEd Logo"
        />
        <img
          src="{{ url_for('static', filename='images/antipolo_division.png') }}"
          alt="City Schools Division Office of Antipolo Logo"
        />
        <img
          src="{{ url_for('static', filename='images/i_love_sgod.png') }}"
          alt="I Love SGOD Logo"
        />
        <img
          src="{{ url_for('static', filename='images/project_irc.png') }}"
          alt="Project IRC Logo"
        />
      </div>
    </header>

    <!-- ===== NAVIGATION BAR ===== -->
    <nav>
      <ul>
        <li>
          <!-- prettier-ignore -->
          <a href="{{ url_for('home') }}"
                   {% if active_tab is none %}class="active"{% endif %}>
                    Home
                </a>
        </li>
        {% for tab in tabs %}
        <li>
          <!-- prettier-ignore -->
          <a href="{{ url_for('view_tab', tab_id=tab.id) }}"
                   title="{{ tab.name }}"
                   {% if active_tab and active_tab.id == tab.id %}class="active"{% endif %}>
                    {{ tab.short }}
                </a>
        </li>
        {% endfor %}
      </ul>
    </nav>

    <!-- ===== PAGE CONTENT ===== -->
    <main class="content">{% block content %}{% endblock %}</main>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
